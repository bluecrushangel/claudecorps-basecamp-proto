<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AT Handoff Prototype</title>
<style>
  /* Palette taken from the Black Hills Works Foundation logo (navy + green) with a teal in between. Change here. */
  :root {
    --navy: #253085; --teal: #0e8c9a; --teal-d: #0b7a87; --green: #84c441; --green-d: #2a8240;
    --bg: #f1f7f8; --tint: #eef6f7; --line: #dbe8ea; --ink: #16233b; --muted: #5b6f7a;
  }
  * { box-sizing: border-box; }
  /* One screen, no page scroll: panels scroll inside themselves. */
  body { margin: 0; padding: 16px; height: 100vh; overflow: hidden; background: var(--bg); font: 14px system-ui, Arial, sans-serif; color: var(--ink); }
  #app { max-width: 1180px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 3px rgba(37, 48, 133, .06); }
  /* sticky: top is -16px to cancel the card's 16px padding, so it pins flush to the top */
  h2 { position: sticky; top: -16px; z-index: 1; background: #fff; margin: -16px -16px 10px; padding: 16px 16px 10px; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--navy); }
  #count, #stamp { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 8px; }

  /* Top strip: small logo + tracker */
  #top { flex: none; display: flex; align-items: center; gap: 20px; padding: 10px 18px; border-top: 3px solid var(--teal); }
  #top img { height: 34px; width: auto; display: block; flex: none; }
  #tracker { flex: 1; min-width: 0; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .track { position: relative; display: flex; justify-content: space-between; margin-top: 8px; }
  .track::before, .fill { content: ""; position: absolute; top: 6px; left: 8%; height: 4px; border-radius: 2px; }
  .track::before { right: 8%; background: var(--line); }
  .fill { background: linear-gradient(90deg, var(--navy), var(--teal), var(--green)); width: 0; transition: width 2s ease-in-out; }
  .stage { position: relative; flex: 1; text-align: center; font-size: 12px; color: var(--muted); }
  .dot { width: 16px; height: 16px; margin: 0 auto 4px; border-radius: 50%; background: #fff; border: 3px solid var(--line); transition: all 1s; }
  .stage.done .dot { background: var(--teal); border-color: var(--teal); }
  .stage.current .dot { background: var(--green); border-color: var(--green); box-shadow: 0 0 0 4px rgba(132, 196, 65, .3); }
  .stage.current { color: var(--navy); font-weight: 700; }

  /* Main row: profile | notes | summary */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px 1fr 1fr; gap: 14px; }
  main > .card { min-height: 0; padding: 16px; overflow-y: auto; }
  .name { font-size: 22px; font-weight: 700; margin: 0; color: var(--navy); }
  .sub { display: inline-block; background: var(--tint); color: var(--teal-d); font-size: 12px; font-weight: 600; margin: 6px 0 12px; padding: 3px 10px; border-radius: 99px; }
  .avatar { width: 100%; aspect-ratio: 4/3; border-radius: 10px; background: linear-gradient(160deg, #d3efe6, #9ccfe0); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .avatar svg { width: 55%; fill: #247f93; }
  select, #q { border: 1px solid #b9d4d8; border-radius: 8px; background: #fff; color: var(--ink); }
  select { margin-top: 12px; width: 100%; padding: 7px; font-size: 14px; }
  select:focus, #q:focus, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .note { background: var(--tint); border-left: 4px solid var(--teal); border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; }
  .note .when { color: var(--navy); font-weight: 600; font-size: 13px; }
  #tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #tools button { margin: 0; padding: 4px 10px; font-size: 13px; background: #fff; color: var(--teal-d); border: 1px solid #b9d4d8; font-weight: 600; }
  #tools button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  #q { flex: 1 1 100%; margin: 0; padding: 6px 8px; font-size: 14px; }

  /* Summary panel: text scrolls, button stays at the bottom */
  #summaryCol { display: flex; flex-direction: column; overflow: hidden; }
  #summary { flex: 1 1 auto; min-height: 0; overflow-y: auto; white-space: pre-wrap; background: var(--tint); border-radius: 8px; padding: 12px; line-height: 1.5; }
  #summary:empty { display: none; }
  .note-box { margin: 10px 0 auto; border: 1px dashed #b9d4d8; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
  button { align-self: flex-end; margin-top: 12px; background: var(--green-d); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: wait; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .loading img { width: 64px; height: 64px; display: block; }

  /* Small screens: stack and scroll normally */
  @media (max-width: 900px) {
    body { height: auto; overflow: visible; }
    #app { height: auto; }
    #top { flex-wrap: wrap; gap: 10px; }
    #tracker { flex: 1 1 100%; }
    main { grid-template-columns: 1fr; }
    main > .card, #summaryCol { overflow: visible; }
  }
</style>
</head>
<body>
<div id="app">
<header id="top" class="card">
  <img src="/images/BHWFoundation-2.png" alt="Black Hills Works Foundation">
  <div id="tracker">
    <div class="meta"><span>AT request: Speech-generating app</span><span>Updated today</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
</header>

<main>
  <section class="card">
    <p class="name" id="name"></p>
    <p class="sub" id="sub"></p>
    <div class="avatar"><svg viewBox="0 0 100 100" aria-label="Generic avatar"><circle cx="50" cy="32" r="18"/><path d="M12 100c0-26 16-40 38-40s38 14 38 40z"/></svg></div>
    <select id="picker" aria-label="Choose a person"></select>
  </section>
  <section class="card">
    <h2>Notes <span id="count"></span></h2>
    <div id="tools">
      <button data-days="1">One day</button><button data-days="7">One week</button><button data-days="30">One month</button><button data-days="0" class="on">All time</button>
      <input id="q" type="search" placeholder="Search keyword or date/time" aria-label="Search notes by keyword or date and time">
    </div>
    <div id="notes"></div>
  </section>
  <section class="card" id="summaryCol">
    <h2>Summary <span id="stamp"></span></h2>
    <div id="summary"></div>
    <div class="note-box">Summaries describe the notes only. Staff decide what they mean.</div>
    <button id="go">Summarize notes</button>
  </section>
</main>
</div>

<script>
// Stage names are placeholders: edit freely.
const STAGES = ['Need identified', 'Summary reviewed', 'Evaluation', 'Funding review', 'Decision', 'Delivered'];
const STEP_MS = 35000; // time per stage; animation stops on the last stage
const TODAY = '2026-10-30'; // assumption: fixed "today" for the demo, so the filters work on the synthetic data
const $ = (id) => document.getElementById(id);

// --- Tracker (visual only, driven by timing) ---
const track = document.querySelector('.track');
const stageEls = STAGES.map((s) => {
  const el = document.createElement('div');
  el.className = 'stage';
  el.innerHTML = '<div class="dot"></div><span></span>';
  el.lastChild.textContent = s;
  track.appendChild(el);
  return el;
});
let cur = 0;
function showStage() {
  stageEls.forEach((el, i) => { el.className = 'stage' + (i < cur ? ' done' : i === cur ? ' current' : ''); });
  $('fill').style.width = (cur / (STAGES.length - 1)) * 84 + '%'; // 84% = track width between first and last dot
}
let timer;
function startTracker() { // also called on every profile switch: nothing is saved, it just restarts
  clearInterval(timer);
  cur = 0;
  showStage();
  timer = setInterval(() => { if (++cur >= STAGES.length - 1) clearInterval(timer); showStage(); }, STEP_MS);
}
startTracker();

// --- Profiles and notes ---
let people = [], person, days = 0; // days: 0 = all time
function renderNotes() {
  let cutoff = '';
  if (days) { // window counts back from TODAY, inclusive (1 = today only)
    const d = new Date(TODAY + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() - (days - 1));
    cutoff = d.toISOString().slice(0, 10);
  }
  const q = $('q').value.trim().toLowerCase().replace(/\//g, '-'); // "10/30" matches "2026-10-30"
  const list = person.notes.filter((n) =>
    n.datetime.slice(0, 10) >= cutoff && (n.datetime + ' ' + n.note).toLowerCase().includes(q));
  $('count').textContent = list.length + ' of ' + person.notes.length + ' notes';
  $('notes').replaceChildren(...list.map((n) => {
    const d = document.createElement('div');
    d.className = 'note';
    d.innerHTML = '<div class="when"></div><div class="text"></div>';
    d.firstChild.textContent = n.datetime;   // shown exactly as stored
    d.lastChild.textContent = n.note;        // shown exactly as stored
    return d;
  }));
}
function show(p) {
  person = p;
  $('name').textContent = p.name;
  $('sub').textContent = p.id + ' · Synthetic profile';
  days = 0; $('q').value = '';
  document.querySelectorAll('#tools button').forEach((b) => b.classList.toggle('on', b.dataset.days === '0'));
  renderNotes();
  $('summary').textContent = '';
  $('stamp').textContent = '';
  startTracker();
}
document.querySelectorAll('#tools button').forEach((b) => {
  b.onclick = () => {
    days = +b.dataset.days;
    document.querySelectorAll('#tools button').forEach((x) => x.classList.toggle('on', x === b));
    renderNotes();
  };
});
$('q').oninput = renderNotes;
fetch('/api/people').then((r) => r.json()).then((list) => {
  people = list;
  $('picker').replaceChildren(...list.map((p, i) => new Option(p.name + ' (' + p.id + ')', i)));
  show(list[0]);
});
$('picker').onchange = (e) => show(people[e.target.value]);

// --- Summarize: runs only on click ---
// Loading animation shown while waiting. Static markup, no user data in it.
const LOADING = '<div class="loading"><img src="/images/claude-claude-code.gif" alt=""><span>Making summary…</span></div>';
$('go').onclick = async () => {
  const btn = $('go'), id = person.id;
  btn.disabled = true;
  $('summary').innerHTML = LOADING;
  $('stamp').textContent = '';
  try {
    const r = await fetch('/api/summarize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
    const data = await r.json();
    if (person.id === id) {
      $('summary').textContent = data.summary || data.error;
      if (data.summary) $('stamp').textContent = 'Summarized ' + new Date().toLocaleString(); // viewer's local time
    }
  } catch {
    $('summary').textContent = 'Could not make a summary. Please try again.';
  }
  btn.disabled = false;
};
</script>
</body>
</html>
